<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Visual Lyric MP3 Player Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --lyric-accent: #22c55e;
    }
    /* Custom Scrollbar for Lyric & Playlist */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      cursor: pointer;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.2);
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Karaoke Dynamic Gradient Lyric Overlay */
    .lyric-gradient-active {
      background: linear-gradient(to right, var(--lyric-accent) var(--progress, 0%), #ffffff var(--progress, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: background-size 0.05s linear;
    }
    .lyric-plain-active {
      color: var(--lyric-accent) !important;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }
    .lyric-none-active {
      color: #ffffff !important;
      font-weight: 700;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-zinc-950 select-none font-sans">

  <!-- Top App Navigation / Header -->
  <header class="relative z-20 flex items-center justify-between px-3 sm:px-6 py-2.5 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 shrink-0">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <!-- Mini Color Ladder Visualizer -->
        <canvas id="mini-visualizer-canvas" class="w-24 h-6 rounded bg-slate-950/80 border border-slate-800/80 md:hidden shadow-inner"></canvas>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
      <!-- Visualizer Mode Switcher Button -->
      <button id="btn-viz-style" title="Switch Visualizer Preset Style" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all">
        <i class="fa-solid fa-sliders text-xs"></i>
        <span id="label-viz-style" class="hidden sm:inline">Mode: Ladder</span>
      </button>

      <!-- Toggle Audio Visualizer On/Off Mode -->
      <button id="btn-viz-toggle" title="Enable/Disable Audio Visualizer" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all">
        <i class="fa-solid fa-chart-simple text-xs"></i>
        <span id="label-viz-mode" class="hidden sm:inline">Viz: On</span>
      </button>

      <!-- Gradient Mode Switch Button -->
      <button id="btn-color-mode" title="Switch Karaoke Effect (Gradient / Plain / Off)" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all">
        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
        <span id="label-color-mode" class="hidden sm:inline">Gradient Green</span>
      </button>

      <!-- Toggle Cover Fit Mode Button -->
      <button id="btn-cover-fit" title="Toggle Cover Image Fit Mode (Contain / Cover)" 
              class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all">
        <i class="fa-solid fa-compress text-xs" id="icon-cover-fit"></i>
        <span id="label-cover-fit" class="hidden sm:inline">Fit: Contain</span>
      </button>

      <!-- Toggle Lyric Color Switcher -->
      <button id="btn-lyric-color" title="Change Active Lyric Theme Color"
              class="flex items-center justify-center px-2.5 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-all text-emerald-400">
        <i id="lyric-color-icon" class="fa-solid fa-palette"></i>
      </button>

      <!-- Toggle Playlist Button -->
      <button id="btn-toggle-playlist" title="Toggle Playlist Drawer" 
              class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20 transition-all">
        <i class="fa-solid fa-list-ul text-xs"></i>
        <span>Playlist</span>
      </button>
    </div>
  </header>

  <!-- Main Display Container -->
  <main class="relative flex-1 flex flex-col md:flex-row overflow-hidden p-3 sm:p-4 md:p-6 gap-3 md:gap-6 max-w-7xl w-full mx-auto min-h-0">

    <!-- LEFT / DESKTOP COVER & VISUALIZER CONTAINER -->

      <!-- Fixed Art Cover Image Element -->

        <img id="art-cover" src="" alt="Album Cover" class="w-full h-full object-contain transition-all duration-300">

      <!-- Track List Items Container -->

  <!-- Bottom Control Bar -->
  <footer class="relative z-20 px-4 sm:px-6 py-3 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 shrink-0">

        <button id="btn-prev" title="Previous Song" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800 transition-all">

        <button id="btn-play-pause" title="Play / Pause" class="p-3 sm:p-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold shadow-lg shadow-emerald-500/25 transition-all">
          <i id="icon-play-pause" class="fa-solid fa-play text-xl"></i>

        <button id="btn-next" title="Next Song" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800 transition-all">
          <i class="fa-solid fa-forward-step text-lg"></i>

        <button id="btn-loop-mode" title="Loop Mode: Repeat All" class="p-2 rounded-xl text-emerald-400 hover:bg-slate-800 transition-all">
          <i class="fa-solid fa-repeat text-base"></i>

        <span id="lyric-btn" onclick="toggleLyric()" class="cursor-pointer text-xl text-slate-300 hover:text-emerald-400 ml-1 transition-all" title="Toggle Lyrics Display"></span>

  <!-- Native Audio Element -->
  <audio id="audio-player" class="hidden" preload="auto"></audio>
  <script src="55playlist.js"></script>
  <script>
    // Fallback playlist array if external 55playlist.js is absent
    if (typeof playlist === 'undefined') {
      window.playlist = [
        {
          id: 'demo-1',
          title: 'Sample Melody',
          artist: 'Audio Artist',
          album: 'Acoustic Dreams',
          cover: 'https://placehold.co/400x400/10b981/ffffff?text=Music+Player',
          audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
          lrcRaw: '[00:00.00]Sample Track - Audio Visualizer\n[00:05.00]Enjoy high quality sound\n[00:10.00]HTML5 Dynamic Lyric Sync'
        }
      ];
    }

    // Player State Variables
    let currentTrackIndex = 0;
    let parsedLyrics = [];
    let activeLyricIndex = -1;
    let isShuffle = false;
    let loopMode = 'all'; // 'none' | 'all' | 'one'
    let karaokeColorMode = 'gradient'; // 'gradient' | 'plain' | 'none'
    let coverFitMode = 'contain'; // 'contain' | 'cover'
    let enableVisualizer = true;
    let vizPresetStyle = 'ladder'; // 'ladder' | 'waveform' | 'circular' | 'particles'
    let isLrcSynced = true;
    let vizAnimFrameId = null;

    // DOM Elements
    const audio = document.getElementById('audio-player');
    const artCover = document.getElementById('art-cover');
    const artCoverMobile = document.getElementById('art-cover-mobile');
    
    const btnCoverFit = document.getElementById('btn-cover-fit');
    const labelCoverFit = document.getElementById('label-cover-fit');
    const iconCoverFit = document.getElementById('icon-cover-fit');

    const sliderBlur = document.getElementById('slider-blur');
    const sliderOpacity = document.getElementById('slider-opacity');
    const blurVal = document.getElementById('blur-val');
    const opacityVal = document.getElementById('opacity-val');

    const sliderBlurM = document.getElementById('slider-blur-m');
    const sliderOpacityM = document.getElementById('slider-opacity-m');
    const blurValM = document.getElementById('blur-val-m');
    const opacityValM = document.getElementById('opacity-val-m');
    const mobileControlsBar = document.getElementById('mobile-controls-bar');
    const btnToggleMobileControls = document.getElementById('btn-toggle-mobile-controls');

    const lyricContainer = document.getElementById('lyric-container');
    const lyricTitle = document.getElementById('lyric-title');
    const lyricMeta = document.getElementById('lyric-meta');

    const lyricColorIcon = document.getElementById('lyric-color-icon');
    const btnLyricColor = document.getElementById('btn-lyric-color'); 
    const btnToggleSync = document.getElementById('btn-toggle-sync');
    const labelSyncMode = document.getElementById('label-sync-mode');

    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPlayPause = document.getElementById('icon-play-pause');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnLoopMode = document.getElementById('btn-loop-mode');
    const btnColorMode = document.getElementById('btn-color-mode');
    const labelColorMode = document.getElementById('label-color-mode');
    const btnVizToggle = document.getElementById('btn-viz-toggle');
    const labelVizMode = document.getElementById('label-viz-mode');
    const btnVizStyle = document.getElementById('btn-viz-style');
    const labelVizStyle = document.getElementById('label-viz-style');

    const sliderProgress = document.getElementById('slider-progress');
    const sliderVolume = document.getElementById('slider-volume');
    const btnMute = document.getElementById('btn-mute');
    const iconMute = document.getElementById('icon-mute');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');

    const playlistDrawer = document.getElementById('playlist-drawer');
    const btnTogglePlaylist = document.getElementById('btn-toggle-playlist');
    const btnClosePlaylist = document.getElementById('btn-close-playlist');
    const playlistItems = document.getElementById('playlist-items');
    const fileInput = document.getElementById('file-input');

    const btnSortTitle = document.getElementById('btn-sort-title');
    const btnSortArtist = document.getElementById('btn-sort-artist');

    // Search Box DOM Elements
    const playlistSearchInput = document.getElementById('playlist-search-input');
    const btnClearSearch = document.getElementById('btn-clear-search');
    let searchQuery = '';

    const canvas = document.getElementById('visualizer-canvas');
    const canvasCtx = canvas ? canvas.getContext('2d') : null;

    const miniCanvas = document.getElementById('mini-visualizer-canvas');
    const miniCanvasCtx = miniCanvas ? miniCanvas.getContext('2d') : null;

    // Parse LRC Timestamps
    function parseLRC(lrcString) {
      if (!lrcString) return { meta: {}, lines: [] };
      
      const lines = lrcString.split('\n');
      const lyricLines = [];
      const meta = {};

      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      const metaRegex = /\[(ti|ar|al):(.*)\]/i;

      lines.forEach(line => {
        const lineTrim = line.trim();
        const metaMatch = lineTrim.match(metaRegex);
        if (metaMatch) {
          meta[metaMatch[1].toLowerCase()] = metaMatch[2].trim();
          return;
        }

        const timeMatch = lineTrim.match(timeRegex);
        if (timeMatch) {
          const minutes = parseInt(timeMatch[1], 10);
          const seconds = parseInt(timeMatch[2], 10);
          const msStr = timeMatch[3];
          const milliseconds = msStr.length === 2 ? parseInt(msStr, 10) * 10 : parseInt(msStr, 10);
          const timeInSeconds = minutes * 60 + seconds + milliseconds / 1000;
          const text = lineTrim.replace(timeRegex, '').trim();

          lyricLines.push({
            time: timeInSeconds,
            text: text || '♪'
          });
        }
      });

      lyricLines.sort((a, b) => a.time - b.time);
      return { meta, lines: lyricLines };
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentTrackIndex = index;
      const track = playlist[index];

      audio.src = track.audioUrl;
      audio.volume = sliderVolume.value;

      const fallbackUrl = 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover';
      artCover.src = track.cover;
      artCover.onerror = () => { artCover.src = fallbackUrl; };
      
      if (artCoverMobile) {
        artCoverMobile.src = track.cover;
        artCoverMobile.onerror = () => { artCoverMobile.src = fallbackUrl; };
      }

      const parsed = parseLRC(track.lrcRaw);
      parsedLyrics = parsed.lines;

      const songTitle = parsed.meta.ti || track.title || "Unknown Title";
      const songArtist = parsed.meta.ar || track.artist || "Unknown Artist";
      const songAlbum = parsed.meta.al || track.album || "Unknown Album";

                  <path d="M8 13h5"></path>

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 .45-1.27"></path>

    function renderPlaylistUI() {
      playlistItems.innerHTML = '';

      const query = searchQuery.trim().toLowerCase();
      const filteredPlaylist = playlist.map((track, originalIndex) => ({ track, originalIndex }))
        .filter(({ track }) => {
          if (!query) return true;
          const titleMatch = (track.title || '').toLowerCase().includes(query);
          const artistMatch = (track.artist || '').toLowerCase().includes(query);
          return titleMatch || artistMatch;

        playlistItems.innerHTML = `

    btnToggleSync.onclick = () => {
      isLrcSynced = !isLrcSynced;
      if (isLrcSynced) {
        btnToggleSync.className = 'px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30 transition-all shrink-0';
        labelSyncMode.textContent = 'LRC Synced';
        if (!audio.paused) updateKaraokeLyrics(audio.currentTime);
      } else {
        btnToggleSync.className = 'px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase rounded-full bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 hover:text-slate-200 transition-all shrink-0';
        labelSyncMode.textContent = 'LRC Unsynced';
        if (activeLyricIndex !== -1) {
          const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (activeEl) {
            activeEl.className = 'text-base sm:text-lg font-medium text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] transition-all duration-200 cursor-pointer hover:text-white';
            activeEl.style.removeProperty('--progress');

          activeLyricIndex = -1;
        }
      }

    function updateKaraokeLyrics(currentTime) {
      if (!parsedLyrics || parsedLyrics.length === 0 || !isLrcSynced) return;

      let index = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) {
          index = i;
        } else {
          break;
        }
      }

      if (index !== activeLyricIndex) {
        if (activeLyricIndex !== -1) {
          const prevEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (prevEl) {
            prevEl.className = 'text-base sm:text-lg font-medium text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] transition-all duration-200 cursor-pointer hover:text-white';
            prevEl.style.removeProperty('--progress');
          }
        }

        activeLyricIndex = index;

        if (activeLyricIndex !== -1) {
          const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (activeEl) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }

      if (activeLyricIndex !== -1 && karaokeColorMode === 'gradient') {
        const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
        if (activeEl) {
          const currentLineTime = parsedLyrics[activeLyricIndex].time;
          const nextLineTime = (activeLyricIndex + 1 < parsedLyrics.length) 
            ? parsedLyrics[activeLyricIndex + 1].time 
            : audio.duration;

          const duration = nextLineTime - currentLineTime;
          const elapsed = currentTime - currentLineTime;
          const percent = Math.min(Math.max((elapsed / duration) * 100, 0), 100);

          activeEl.className = 'text-lg sm:text-xl font-bold lyric-gradient-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer';
          activeEl.style.setProperty('--progress', `${percent}%`);
        }
      } else if (activeLyricIndex !== -1) {
        const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
        if (activeEl) {
          activeEl.className = karaokeColorMode === 'plain' 
            ? 'text-lg sm:text-xl font-bold lyric-plain-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer' 
            : 'text-lg sm:text-xl font-bold lyric-none-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer';
        }
      }
    }

    // Helper: Device Pixel Ratio High-DPI Canvas Resizer
    function fitCanvasToContainer(targetCanvas) {
      if (!targetCanvas) return { width: 0, height: 0, dpr: 1 };
      const dpr = window.devicePixelRatio || 1;
      const rect = targetCanvas.getBoundingClientRect();
      const displayWidth = Math.floor(rect.width * dpr);
      const displayHeight = Math.floor(rect.height * dpr);

      if (targetCanvas.width !== displayWidth || targetCanvas.height !== displayHeight) {
        targetCanvas.width = displayWidth;
        targetCanvas.height = displayHeight;
      }
      return { width: targetCanvas.width, height: targetCanvas.height, dpr };
    }

    // Particle System for Burst Mode
    const particles = Array.from({ length: 30 }, () => ({
      x: 0.5,
      y: 0.5,
      vx: (Math.random() - 0.5) * 0.01,
      vy: (Math.random() - 0.5) * 0.01,
      size: Math.random() * 4 + 2,
      color: `hsl(${Math.random() * 120 + 120}, 100%, 60%)`
    }));

    // Multi-Mode Visualizer Engine
    function startVisualizerAnimation() {
      if (vizAnimFrameId) cancelAnimationFrame(vizAnimFrameId);

      const numBars = 28;
      const barFrequencies = Array.from({ length: numBars }, () => Math.random() * 0.3);

      function draw() {
        vizAnimFrameId = requestAnimationFrame(draw);

        if (!enableVisualizer) return;

        const isAudioPlaying = !audio.paused && !audio.ended && audio.currentTime > 0;

        for (let i = 0; i < numBars; i++) {
          if (isAudioPlaying) {
            const noise = Math.sin((Date.now() / 100) + (i * 0.45));
            const target = (noise * 0.45 + 0.55) * (audio.volume || 0.8) * (0.4 + (i % 5) * 0.12);
            barFrequencies[i] += (target - barFrequencies[i]) * 0.25;
          } else {
            barFrequencies[i] *= 0.88;
          }
        }

        // 1. MAIN DESKTOP / NOTEBOOK CANVAS VISUALIZER
        if (canvasCtx && canvas) {
          const { width, height, dpr } = fitCanvasToContainer(canvas);
          canvasCtx.clearRect(0, 0, width, height);

          if (vizPresetStyle === 'ladder') {
            // MODE A: Color Segmented Ladder Blocks
            const barGap = 4 * dpr;
            const barWidth = Math.max((width - (numBars * barGap)) / numBars, 2 * dpr);
            const totalSteps = 10;
            const stepGap = 2 * dpr;

            for (let i = 0; i < numBars; i++) {
              const freq = barFrequencies[i];
              const activeSteps = Math.ceil(freq * totalSteps);
              const x = i * (barWidth + barGap);
              const stepHeight = (height - (totalSteps * stepGap)) / totalSteps;

              for (let s = 0; s < totalSteps; s++) {
                const stepY = height - ((s + 1) * (stepHeight + stepGap));
                const isStepActive = s < activeSteps;

                if (isStepActive) {
                  // Vibrant color gradient progression per ladder level
                  const ratio = s / totalSteps;
                  const hue = 140 - (ratio * 120); // Green (140) to Yellow to Red (20)
                  canvasCtx.fillStyle = `hsla(${hue}, 95%, 55%, 0.95)`;
                  canvasCtx.shadowColor = `hsla(${hue}, 100%, 50%, 0.5)`;
                  canvasCtx.shadowBlur = 6 * dpr;
                } else {
                  canvasCtx.fillStyle = 'rgba(30, 41, 59, 0.4)';
                  canvasCtx.shadowBlur = 0;
                }

                canvasCtx.beginPath();
                canvasCtx.roundRect(x, stepY, barWidth, stepHeight, [2 * dpr]);
                canvasCtx.fill();
              }
            }
            canvasCtx.shadowBlur = 0;

          } else if (vizPresetStyle === 'waveform') {
            // MODE B: Smooth Neon Waveform / Oscilloscope Curve
            canvasCtx.beginPath();
            canvasCtx.lineWidth = 3 * dpr;
            canvasCtx.strokeStyle = '#22c55e';
            canvasCtx.shadowColor = '#10b981';
            canvasCtx.shadowBlur = 12 * dpr;

            const sliceWidth = width / numBars;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
              const v = barFrequencies[i];
              const y = (v * height * 0.8) / 2 + (height / 2) * (i % 2 === 0 ? 1 : -1) * 0.3 + (height / 2);

              if (i === 0) canvasCtx.moveTo(x, y);
              else canvasCtx.lineTo(x, y);

              x += sliceWidth;
            }

            canvasCtx.lineTo(width, height / 2);
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

          } else if (vizPresetStyle === 'circular') {
            // MODE C: Radial Spectrum Burst Ring
            const centerX = width / 2;
            const centerY = height / 2;
            const baseRadius = Math.min(width, height) * 0.22;
            const totalRays = 24;

            canvasCtx.save();
            canvasCtx.translate(centerX, centerY);

            for (let i = 0; i < totalRays; i++) {
              const angle = (i / totalRays) * Math.PI * 2;
              const freqIdx = i % numBars;
              const rayLen = barFrequencies[freqIdx] * baseRadius * 1.8;

              const x1 = Math.cos(angle) * baseRadius;
              const y1 = Math.sin(angle) * baseRadius;
              const x2 = Math.cos(angle) * (baseRadius + rayLen + 2);
              const y2 = Math.sin(angle) * (baseRadius + rayLen + 2);

              const hue = (i / totalRays) * 360;
              canvasCtx.strokeStyle = `hsl(${hue}, 90%, 60%)`;
              canvasCtx.lineWidth = 3 * dpr;
              canvasCtx.beginPath();
              canvasCtx.moveTo(x1, y1);
              canvasCtx.lineTo(x2, y2);
              canvasCtx.stroke();
            }
            canvasCtx.restore();

          } else if (vizPresetStyle === 'particles') {
            // MODE D: Particle Frequency Explosion
            const avgVal = barFrequencies.reduce((a, b) => a + b, 0) / numBars;

            particles.forEach((p, idx) => {
              if (isAudioPlaying) {
                p.x += p.vx * (1 + avgVal * 3);
                p.y += p.vy * (1 + avgVal * 3);
              }

              if (p.x < 0) p.x = 1;
              if (p.x > 1) p.x = 0;
              if (p.y < 0) p.y = 1;
              if (p.y > 1) p.y = 0;

              const px = p.x * width;
              const py = p.y * height;
              const pSize = p.size * dpr * (1 + avgVal * 1.5);

              canvasCtx.fillStyle = p.color;
              canvasCtx.beginPath();
              canvasCtx.arc(px, py, pSize, 0, Math.PI * 2);
              canvasCtx.fill();
            });
          }
        }

        // 2. HEADER MINI CANVAS COLOR LADDER VISUALIZER
        if (miniCanvasCtx && miniCanvas) {
          const { width: mWidth, height: mHeight, dpr: mDpr } = fitCanvasToContainer(miniCanvas);
          miniCanvasCtx.clearRect(0, 0, mWidth, mHeight);

          const miniBars = 10;
          const miniGap = 2 * mDpr;
          const miniBarWidth = Math.max((mWidth - (miniBars * miniGap)) / miniBars, 2 * mDpr);
          const steps = 5;
          const stepGap = 1 * mDpr;

          for (let i = 0; i < miniBars; i++) {
            const freqIdx = Math.floor(i * (numBars / miniBars));
            const freq = barFrequencies[freqIdx];
            const activeSteps = Math.ceil(freq * steps);
            const x = i * (miniBarWidth + miniGap);
            const stepHeight = (mHeight - (steps * stepGap)) / steps;

            for (let s = 0; s < steps; s++) {
              const stepY = mHeight - ((s + 1) * (stepHeight + stepGap));
              if (s < activeSteps) {
                // Ladder colors: Green -> Yellow -> Red
                const colors = ['#10b981', '#34d399', '#facc15', '#f97316', '#ef4444'];
                miniCanvasCtx.fillStyle = colors[s] || '#10b981';
              } else {
                miniCanvasCtx.fillStyle = 'rgba(30, 41, 59, 0.5)';
              }
              miniCanvasCtx.fillRect(x, stepY, miniBarWidth, stepHeight);
            }
          }
        }
      }

      draw();
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Window Load Initialization
    window.onload = () => {
      loadTrack(0);
      startVisualizerAnimation();
    };

    // Auto-fit Canvas on Window Resize
    window.onresize = () => {
      if (canvas) fitCanvasToContainer(canvas);
      if (miniCanvas) fitCanvasToContainer(miniCanvas);
    };
  </script>
</body>
</html>
