      :root {
      --lyric-accent:#22c55e;
    }


  #22c55e
    /* Custom Scrollbar for Lyric & Playlist */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      cursor: pointer;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.2);
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Karaoke Dynamic Green Gradient Lyric Overlay */
    .lyric-gradient-active {
      background: linear-gradient(to right, var(--lyric-accent) var(--progress, 0%), #ffffff var(--progress, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: background-size 0.05s linear;
    }
    .lyric-plain-active {
      color: var(--lyric-accent) !important;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }
    .lyric-none-active {
      color: #ffffff !important;
      font-weight: 700;
    }
  </style>
</head>

    // Parse LRC Timestamps
    function parseLRC(lrcString) {
      if (!lrcString) return { meta: {}, lines: [] };
      
      const lines = lrcString.split('\n');
      const lyricLines = [];
      const meta = {};

      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      const metaRegex = /\[(ti|ar|al):(.*)\]/i;

      lines.forEach(line => {
        const lineTrim = line.trim();
        const metaMatch = lineTrim.match(metaRegex);
        if (metaMatch) {
          meta[metaMatch[1].toLowerCase()] = metaMatch[2].trim();
          return;
        }

        const timeMatch = lineTrim.match(timeRegex);
        if (timeMatch) {
          const minutes = parseInt(timeMatch[1], 10);
          const seconds = parseInt(timeMatch[2], 10);
          const msStr = timeMatch[3];
          const milliseconds = msStr.length === 2 ? parseInt(msStr, 10) * 10 : parseInt(msStr, 10);
          const timeInSeconds = minutes * 60 + seconds + milliseconds / 1000;
          const text = lineTrim.replace(timeRegex, '').trim();

          lyricLines.push({
            time: timeInSeconds,
            text: text || '♪'
          });
        }
      });

      lyricLines.sort((a, b) => a.time - b.time);
      return { meta, lines: lyricLines };
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentTrackIndex = index;
      const track = playlist[index];

      audio.src = track.audioUrl;
      audio.volume = sliderVolume.value;

      const fallbackUrl = 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover';
      artCover.src = track.cover;
      artCover.onerror = () => { artCover.src = fallbackUrl; };
      
      if (artCoverMobile) {
        artCoverMobile.src = track.cover;
        artCoverMobile.onerror = () => { artCoverMobile.src = fallbackUrl; };
      }

      const parsed = parseLRC(track.lrcRaw);
      parsedLyrics = parsed.lines;

      const songTitle = parsed.meta.ti || track.title || "Unknown Title";
      const songArtist = parsed.meta.ar || track.artist || "Unknown Artist";
      const songAlbum = parsed.meta.al || track.album || "Unknown Album";

      if (lyricTitle) lyricTitle.textContent = songTitle;
      if (lyricMeta) lyricMeta.textContent = `${songArtist} • ${songAlbum}`;
      if (headerSongInfo) headerSongInfo.textContent = `${songTitle} - ${songArtist}`;

      renderLyrics();
      renderPlaylistUI();
    }

    function renderLyrics() {
      lyricContainer.innerHTML = '';
      if (parsedLyrics.length === 0) {
        lyricContainer.innerHTML = `<p class="text-slate-400 italic text-sm drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">No lyrics found for this track.</p>`;
        return;
      }

      parsedLyrics.forEach((item, i) => {
        const p = document.createElement('p');
        p.id = `lyric-line-${i}`;
        p.className = 'text-base sm:text-lg font-medium text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] transition-all duration-200 cursor-pointer hover:text-white';
        p.textContent = item.text;
        p.onclick = () => {
          audio.currentTime = item.time;
          playAudio();
        };
        lyricContainer.appendChild(p);
      });
    }

    function renderPlaylistUI() {
      playlistItems.innerHTML = '';
      playlist.forEach((track, i) => {
        const item = document.createElement('div');
        const isActive = i === currentTrackIndex;
        item.className = `flex items-center gap-3 p-2.5 rounded-xl cursor-pointer transition-all ${
          isActive ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'hover:bg-slate-800/60 text-slate-300'
        }`;
        
        item.innerHTML = `
          <div class="w-10 h-10 rounded-lg overflow-hidden shrink-0 bg-slate-800">
            <img src="${track.cover}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/1e293b/10b981?text=MP3'">
          </div>
          <div class="truncate flex-1">
            <p class="text-xs font-semibold truncate ${isActive ? 'text-emerald-400' : 'text-slate-200'}">${track.title}</p>
            <p class="text-[10px] text-slate-400 truncate">${track.artist}</p>
          </div>
          ${isActive ? '<i class="fa-solid fa-volume-high text-emerald-400 text-xs shrink-0"></i>' : ''}
        `;

        item.onclick = () => {
          loadTrack(i);
          playAudio();
          playlistDrawer.classList.add('translate-x-full');
        };
        playlistItems.appendChild(item);
      });
    }

    function playAudio() {
      audio.play().then(() => {
        iconPlayPause.className = "fa-solid fa-pause text-xl";
      }).catch(err => {
        console.warn("Audio playback exception:", err);
      });
    }

    function pauseAudio() {
      audio.pause();
      iconPlayPause.className = "fa-solid fa-play text-xl";
    }

//color switcher
if (btnLyricColor) {

  const lyricColors = [

    if (!audio.paused) {

  }

  applyLyricColor();

  btnLyricColor.onclick = () => {

    currentColorIndex =
      (currentColorIndex + 1) % lyricColors.length;

    localStorage.setItem(
      'lyricColorIndex',
      currentColorIndex
    );

    applyLyricColor();
  };
}

    btnPlayPause.onclick = () => {
      if (audio.paused) {
        playAudio();
      } else {
        pauseAudio();
      }
    };

    btnNext.onclick = () => {
      if (isShuffle) {
        currentTrackIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      }
      loadTrack(currentTrackIndex);
      playAudio();
    };

    btnPrev.onclick = () => {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      playAudio();
    };

    // Timeline Updates
    audio.ontimeupdate = () => {
      if (isNaN(audio.duration)) return;
      const cur = audio.currentTime;
      const dur = audio.duration;

      sliderProgress.value = (cur / dur) * 100;
      timeCurrent.textContent = formatTime(cur);
      timeTotal.textContent = formatTime(dur);

      if (isLrcSynced) {
        updateKaraokeLyrics(cur);
      }
    };

    audio.onended = () => {
      if (loopMode === 'one') {
        audio.currentTime = 0;
        playAudio();
      } else if (loopMode === 'all' || isShuffle) {
        btnNext.click();
      } else {
        pauseAudio();
      }
    };

    sliderProgress.oninput = () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (sliderProgress.value / 100) * audio.duration;
      }
    };

    // Sync Toggle Handler
    btnToggleSync.onclick = () => {
      isLrcSynced = !isLrcSynced;
      if (isLrcSynced) {
        btnToggleSync.className = 'px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30 transition-all shrink-0';
        labelSyncMode.textContent = 'LRC Synced';
        if (!audio.paused) updateKaraokeLyrics(audio.currentTime);
      } else {
        btnToggleSync.className = 'px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase rounded-full bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 hover:text-slate-200 transition-all shrink-0';
        labelSyncMode.textContent = 'LRC Unsynced';
        if (activeLyricIndex !== -1) {
          const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (activeEl) {
            activeEl.className = 'text-base sm:text-lg font-medium text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] transition-all duration-200 cursor-pointer hover:text-white';
            activeEl.style.removeProperty('--progress');
          }
          activeLyricIndex = -1;
        }
      }
    };

    function updateKaraokeLyrics(currentTime) {
      if (!parsedLyrics || parsedLyrics.length === 0 || !isLrcSynced) return;

      let index = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) {
          index = i;
        } else {
          break;
        }
      }

      if (index !== activeLyricIndex) {
        if (activeLyricIndex !== -1) {
          const prevEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (prevEl) {
            prevEl.className = 'text-base sm:text-lg font-medium text-slate-200 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)] transition-all duration-200 cursor-pointer hover:text-white';
            prevEl.style.removeProperty('--progress');
          }
        }

        activeLyricIndex = index;

        if (activeLyricIndex !== -1) {
          const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (activeEl) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }

      if (activeLyricIndex !== -1 && karaokeColorMode === 'gradient') {
        const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
        if (activeEl) {
          const currentLineTime = parsedLyrics[activeLyricIndex].time;
          const nextLineTime = (activeLyricIndex + 1 < parsedLyrics.length) 
            ? parsedLyrics[activeLyricIndex + 1].time 
            : audio.duration;

          const duration = nextLineTime - currentLineTime;
          const elapsed = currentTime - currentLineTime;
          const percent = Math.min(Math.max((elapsed / duration) * 100, 0), 100);

          activeEl.className = 'text-lg sm:text-xl font-bold lyric-gradient-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer';
          activeEl.style.setProperty('--progress', `${percent}%`);
        }
      } else if (activeLyricIndex !== -1) {
        const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
        if (activeEl) {
          activeEl.className = karaokeColorMode === 'plain' 
            ? 'text-lg sm:text-xl font-bold lyric-plain-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer' 
            : 'text-lg sm:text-xl font-bold lyric-none-active drop-shadow-[0_2px_10px_rgba(0,0,0,1)] transition-all cursor-pointer';
        }
      }
    }

    // Sliders & Controls
    sliderBlur.oninput = (e) => {
      const val = e.target.value;
      blurVal.textContent = `${val}px`;
      artCover.style.filter = `blur(${val}px)`;
      if (artCoverMobile) artCoverMobile.style.filter = `blur(${val}px)`;
    };

    sliderOpacity.oninput = (e) => {
      const val = e.target.value;
      opacityVal.textContent = `${val}%`;
      artCover.style.opacity = val / 100;
      if (artCoverMobile) artCoverMobile.style.opacity = val / 100;
    };

    if (sliderBlurM) {
      sliderBlurM.oninput = (e) => {
        const val = e.target.value;
        blurValM.textContent = `${val}px`;
        artCover.style.filter = `blur(${val}px)`;
        if (artCoverMobile) artCoverMobile.style.filter = `blur(${val}px)`;
      };
    }

    if (sliderOpacityM) {
      sliderOpacityM.oninput = (e) => {
        const val = e.target.value;
        opacityValM.textContent = `${val}%`;
        artCover.style.opacity = val / 100;
        if (artCoverMobile) artCoverMobile.style.opacity = val / 100;
      };
    }

    if (btnToggleMobileControls) {
      btnToggleMobileControls.onclick = () => {
        mobileControlsBar.classList.toggle('hidden');
      };
    }

    btnLoopMode.onclick = () => {
      if (loopMode === 'all') {
        loopMode = 'one';
        btnLoopMode.className = 'p-2 rounded-xl text-emerald-400 bg-emerald-500/10 border border-emerald-500/20';
        btnLoopMode.title = 'Loop Mode: Repeat One';
        btnLoopMode.innerHTML = `<i class="fa-solid fa-repeat text-base"></i><span class="text-[9px] font-bold absolute -top-1 -right-1 bg-emerald-500 text-slate-950 rounded-full w-3.5 h-3.5 flex items-center justify-center">1</span>`;
      } else if (loopMode === 'one') {
        loopMode = 'none';
        btnLoopMode.className = 'p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800';
        btnLoopMode.title = 'Loop Mode: No Repeat';
        btnLoopMode.innerHTML = `<i class="fa-solid fa-repeat text-base"></i>`;
      } else {
        loopMode = 'all';
        btnLoopMode.className = 'p-2 rounded-xl text-emerald-400 hover:bg-slate-800';
        btnLoopMode.title = 'Loop Mode: Repeat All';
        btnLoopMode.innerHTML = `<i class="fa-solid fa-repeat text-base"></i>`;
      }
    };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.className = isShuffle 
        ? 'p-2 rounded-xl text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 transition-all'
        : 'p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all';
    };

    if (btnCoverFit) {
      btnCoverFit.onclick = () => {
        coverFitMode = coverFitMode === 'contain' ? 'cover' : 'contain';
        
        if (artCover) artCover.style.objectFit = coverFitMode;
        if (artCoverMobile) artCoverMobile.style.objectFit = coverFitMode;

        if (labelCoverFit) {
          labelCoverFit.textContent = coverFitMode === 'contain' ? 'Fit: Contain' : 'Fit: Cover';
        }
        if (iconCoverFit) {
          iconCoverFit.className = coverFitMode === 'contain' ? 'fa-solid fa-compress text-xs' : 'fa-solid fa-expand text-xs' ;
        }
      };
    }

    if (btnColorMode) {
      btnColorMode.onclick = () => {
        if (karaokeColorMode === 'gradient') {
          karaokeColorMode = 'plain';
          if (labelColorMode) labelColorMode.textContent = 'Plain Green';
        } else if (karaokeColorMode === 'plain') {
          karaokeColorMode = 'none';
          if (labelColorMode) labelColorMode.textContent = 'No Green';
        } else {
          karaokeColorMode = 'gradient';
          if (labelColorMode) labelColorMode.textContent = 'Gradient Green';
        }
        if (!audio.paused && isLrcSynced) {
          updateKaraokeLyrics(audio.currentTime);
        }
      };
    }

    if (btnVizToggle) {
      btnVizToggle.onclick = () => {
        enableVisualizer = !enableVisualizer;
        if (labelVizMode) {
          labelVizMode.textContent = enableVisualizer ? 'Viz: On' : 'Viz: Off';
        }
        btnVizToggle.className = enableVisualizer
          ? 'flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all'
          : 'flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 transition-all';
        
        if (!enableVisualizer) {
          if (canvasCtx && canvas) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
          if (miniCanvasCtx && miniCanvas) miniCanvasCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
        }
      };
    }

    sliderVolume.oninput = (e) => {
      audio.volume = e.target.value;
      iconMute.className = audio.volume == 0 ? "fa-solid fa-volume-xmark text-base" : "fa-solid fa-volume-high text-base";
    };

    btnMute.onclick = () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        audio.volume = 0;
        sliderVolume.value = 0;
        iconMute.className = "fa-solid fa-volume-xmark text-base";
      } else {
        audio.volume = audio.dataset.prevVol || 0.8;
        sliderVolume.value = audio.volume;
        iconMute.className = "fa-solid fa-volume-high text-base";
      }
    };

    btnTogglePlaylist.onclick = () => playlistDrawer.classList.remove('translate-x-full');
    btnClosePlaylist.onclick = () => playlistDrawer.classList.add('translate-x-full');

    fileInput.onchange = (e) => {
      const files = Array.from(e.target.files);
      let newMp3s = [];
      let lrcMap = {};

      files.forEach(f => {
        if (f.name.toLowerCase().endsWith('.mp3')) newMp3s.push(f);
        if (f.name.toLowerCase().endsWith('.lrc')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const baseName = f.name.replace(/\.lrc$/i, '');
            lrcMap[baseName] = evt.target.result;
          };
          reader.readAsText(f);
        }
      });

      setTimeout(() => {
        newMp3s.forEach((mp3, idx) => {
          const baseName = mp3.name.replace(/\.mp3$/i, '');
          const audioUrl = URL.createObjectURL(mp3);
          const lrcRaw = lrcMap[baseName] || `[00:00.00]${mp3.name}`;

          playlist.push({
            id: `local-${Date.now()}-${idx}`,
            title: baseName,
            artist: "Local Track",
            album: "My Music",
            cover: "https://placehold.co/400x400/10b981/ffffff?text=MP3",
            audioUrl: audioUrl,
            lrcRaw: lrcRaw
          });
        });

        if (newMp3s.length > 0) {
          loadTrack(playlist.length - newMp3s.length);
          playAudio();
        }
      }, 300);
    };

    // Main & Header Mini Canvas Visualizer Renderer
    function startVisualizerAnimation() {
      if (vizAnimFrameId) cancelAnimationFrame(vizAnimFrameId);

      const numBars = 32;
      const barFrequencies = Array.from({ length: numBars }, () => Math.random() * 0.5);

      function draw() {
        vizAnimFrameId = requestAnimationFrame(draw);

        if (!enableVisualizer) return;

        const isAudioPlaying = !audio.paused && !audio.ended && audio.currentTime > 0;

        for (let i = 0; i < numBars; i++) {
          if (isAudioPlaying) {
            const target = (Math.sin((Date.now() / 120) + (i * 0.4)) * 0.4 + 0.5) * (audio.volume || 0.8);
            barFrequencies[i] += (target - barFrequencies[i]) * 0.2;
          } else {
            barFrequencies[i] *= 0.85;
          }
        }

        // 1. Main Desktop Visualizer
        if (canvasCtx && canvas) {
          if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
          }
          canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
          const width = canvas.width;
          const height = canvas.height;
          const barGap = 3;
          const barWidth = Math.max((width - (numBars * barGap)) / numBars, 2);

          for (let i = 0; i < numBars; i++) {
            const barHeight = Math.max(barFrequencies[i] * height, 3);
            const x = i * (barWidth + barGap);
            const y = height - barHeight;

            const gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
            gradient.addColorStop(0, '#10b981');
            gradient.addColorStop(0.7, '#34d399');
            gradient.addColorStop(1, '#a7f3d0');

            canvasCtx.fillStyle = gradient;
            canvasCtx.beginPath();
            canvasCtx.roundRect(x, y, barWidth, barHeight, [3, 3, 0, 0]);
            canvasCtx.fill();
          }
        }

        // 2. Header Mini Visualizer (Small screens / Header)
        if (miniCanvasCtx && miniCanvas) {
          if (miniCanvas.width !== miniCanvas.clientWidth || miniCanvas.height !== miniCanvas.clientHeight) {
            miniCanvas.width = miniCanvas.clientWidth;
            miniCanvas.height = miniCanvas.clientHeight;
          }
          miniCanvasCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
          const miniBars = 8;
          const miniWidth = miniCanvas.width;
          const miniHeight = miniCanvas.height;
          const miniGap = 1.5;
          const miniBarWidth = Math.max((miniWidth - (miniBars * miniGap)) / miniBars, 1.5);

          for (let i = 0; i < miniBars; i++) {
            const freqIdx = i * 4;
            const barHeight = Math.max(barFrequencies[freqIdx] * miniHeight, 2);
            const x = i * (miniBarWidth + miniGap);
            const y = miniHeight - barHeight;

            miniCanvasCtx.fillStyle = '#22c55e';
            miniCanvasCtx.fillRect(x, y, miniBarWidth, barHeight);
          }
        }
      }

      draw();
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    window.onload = () => {
      loadTrack(0);
      startVisualizerAnimation();
    };
  </script>
</body>
</html>
