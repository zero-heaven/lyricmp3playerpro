<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Visual Lyric MP3 Player Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --lyric-accent: #22c55e;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }

    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; cursor: pointer; border-radius: 9999px; background: rgba(255, 255, 255, 0.2); }
    input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: #10b981; cursor: pointer; -webkit-appearance: none; margin-top: -5px; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

    .lyric-gradient-active {
      background: linear-gradient(to right, var(--lyric-accent) var(--progress, 0%), #ffffff var(--progress, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: background-size 0.05s linear;
    }
    .lyric-plain-active {
      color: var(--lyric-accent) !important;
      -webkit-text-fill-color: var(--lyric-accent) !important;
      background: none !important;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }
    .lyric-none-active {
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      background: none !important;
      font-weight: 700;
    }

    @media screen and (max-width: 1024px) and (orientation: landscape) {
      #desktop-art-controls { display: none !important; }
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-zinc-950 select-none font-sans">

  <!-- Header -->
  <header class="relative z-20 flex items-center justify-between px-2 sm:px-6 py-2 sm:py-3 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 shrink-0 gap-1">
    <div class="flex items-center shrink-0">
      <!-- Wider and improved mini visualizer canvas -->
      <canvas id="mini-visualizer-canvas" class="w-28 sm:w-36 h-4 sm:h-5 rounded bg-slate-950/60 border border-slate-800/80 md:hidden"></canvas>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-1 sm:gap-2 flex-nowrap justify-end overflow-x-auto">
      <button id="btn-color-mode" title="Switch Karaoke Effect" 
              class="flex items-center gap-1 px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all shrink-0">
        <i class="fa-solid fa-palette text-xs"></i>
        <span id="label-color-mode" class="hidden sm:inline">Gradient</span>
      </button>

      <button id="btn-cover-fit" title="Toggle Cover Image Fit Mode" 
              class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all shrink-0">
        <i class="fa-solid fa-compress text-xs" id="icon-cover-fit"></i>
        <span id="label-cover-fit" class="hidden sm:inline">Fit: Contain</span>
      </button>

      <button id="btn-viz-toggle" title="Switch Audio Visualizer Style" 
              class="flex items-center gap-1 px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all shrink-0">
        <i class="fa-solid fa-chart-simple text-xs"></i>
        <span id="label-viz-mode" class="hidden sm:inline">Viz: Ladder</span>
      </button>

      <button id="btn-lyric-color" title="Change Lyric Color"
              class="flex items-center justify-center px-2 py-1.5 text-base sm:text-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-all shrink-0">
        <i id="lyric-color-icon" class="fa-solid fa-palette text-xs sm:text-base"></i>
      </button>

      <button id="btn-toggle-playlist" title="Toggle Playlist Drawer" 
              class="flex items-center gap-1 px-2.5 sm:px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20 transition-all shrink-0">
        <i class="fa-solid fa-list-ul text-xs"></i>
        <span>Playlist</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="relative flex-1 flex flex-col md:flex-row overflow-hidden p-3 sm:p-4 md:p-6 gap-3 md:gap-6 max-w-7xl w-full mx-auto min-h-0">
    <section id="desktop-cover-section" class="hidden md:flex w-1/2 flex-col items-center justify-center rounded-2xl overflow-hidden border border-slate-800/80 bg-slate-900/40 backdrop-blur-xl shadow-2xl p-4 shrink-0 max-h-full">
      <div class="relative w-full max-w-[320px] aspect-square rounded-2xl overflow-hidden shadow-2xl border border-white/10 group shrink-0 flex items-center justify-center bg-black/40">
        <img id="art-cover" src="" alt="Album Cover" crossorigin="anonymous" class="w-full h-full object-contain transition-all duration-300">
        <canvas id="smoke-canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-0 transition-opacity duration-700"></canvas>
        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/0 transition-all pointer-events-none"></div>
      </div>
      
      <div id="desktop-art-controls" class="w-full max-w-xs mt-3 p-3 rounded-xl bg-slate-950/60 border border-slate-800/60 backdrop-blur-md space-y-2 shrink-0 overflow-y-auto max-h-[220px]">
        <div class="flex items-center justify-between text-xs text-slate-300">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-wand-magic-sparkles text-emerald-400"></i> Cover Blur 
            <span id="smoke-badge" class="text-[10px] text-emerald-400 hidden">(Sky Cloud Active)</span>
          </span>
          <span id="blur-val" class="font-mono text-emerald-400">0px</span>
        </div>
        <input id="slider-blur" type="range" min="0" max="40" value="0" step="1" class="w-full">

        <div class="flex items-center justify-between text-xs text-slate-300">
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-eye text-emerald-400"></i> Transparency</span>
          <span id="opacity-val" class="font-mono text-emerald-400">100%</span>
        </div>
        <input id="slider-opacity" type="range" min="10" max="100" value="100" step="1" class="w-full">

        <div class="flex items-center justify-between text-xs text-slate-300 pt-1 border-t border-slate-800">
          <span>Cloud Speed</span><span id="speed-val" class="font-mono text-emerald-400">1.0x</span>
        </div>
        <input id="slider-cloud-speed" type="range" min="0.5" max="3.0" value="1.0" step="0.1" class="w-full">

        <div class="flex items-center justify-between text-xs text-slate-300">
          <span>Cloud Amount</span><span id="amount-val" class="font-mono text-emerald-400">6</span>
        </div>
        <input id="slider-cloud-amount" type="range" min="3" max="15" value="6" step="1" class="w-full">
      </div>

      <div class="w-full max-w-md h-8 mt-3 shrink-0">
        <canvas id="visualizer-canvas" class="w-full h-full rounded-lg"></canvas>
      </div>
    </section>

    <!-- Right Lyric Container -->
    <section class="relative w-full md:w-1/2 flex-1 flex flex-col rounded-2xl overflow-hidden border border-slate-800/80 bg-slate-900/30 md:bg-slate-900/40 backdrop-blur-xl shadow-2xl min-h-0">
      <div class="md:hidden absolute inset-0 z-0 flex items-center justify-center p-4 pointer-events-none overflow-hidden">
        <img id="art-cover-mobile" src="" crossorigin="anonymous" class="w-full h-full object-contain rounded-2xl shadow-2xl transition-all duration-300">
        <canvas id="smoke-canvas-mobile" class="absolute inset-0 w-full h-full pointer-events-none opacity-0 transition-opacity duration-700"></canvas>
      </div>
      <div class="relative z-10 px-4 py-2.5 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-md flex items-center justify-between shrink-0">
        <div class="truncate">
          <h2 id="lyric-title" class="font-bold text-sm sm:text-base text-slate-100 truncate">Song Title</h2>
          <p id="lyric-meta" class="text-[11px] sm:text-xs text-slate-400 truncate">Artist • Album</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-toggle-mobile-controls" class="md:hidden px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700"><i class="fa-solid fa-sliders"></i> Art Controls</button>
          <button id="btn-toggle-sync" class="px-2.5 py-1 text-[10px] font-bold tracking-wider uppercase rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30 transition-all shrink-0">
            <i class="fa-solid fa-arrows-rotate text-[9px] mr-1"></i>
            <span id="label-sync-mode">LRC Synced</span>
          </button>
        </div>
      </div>
      
      <!-- Mobile Controls Bar -->
      <div id="mobile-controls-bar" class="hidden md:hidden relative z-10 p-3 bg-slate-950/95 border-b border-slate-800/80 flex flex-col gap-2.5 shrink-0">
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>Blur: <span id="blur-val-m" class="text-emerald-400 font-mono">0px</span></span>
          <input id="slider-blur-m" type="range" min="0" max="40" value="0" step="1" class="w-1/2">
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>Transparency: <span id="opacity-val-m" class="text-emerald-400 font-mono">100%</span></span>
          <input id="slider-opacity-m" type="range" min="10" max="100" value="100" step="1" class="w-1/2">
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>Cloud Speed: <span id="speed-val-m" class="text-emerald-400 font-mono">1.0x</span></span>
          <input id="slider-cloud-speed-m" type="range" min="0.5" max="3.0" value="1.0" step="0.1" class="w-1/2">
        </div>
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>Cloud Amount: <span id="amount-val-m" class="text-emerald-400 font-mono">6</span></span>
          <input id="slider-cloud-amount-m" type="range" min="3" max="15" value="6" step="1" class="w-1/2">
        </div>
      </div>

      <div id="lyric-container" class="relative z-10 flex-1 overflow-y-auto px-4 sm:px-6 py-20 sm:py-32 space-y-4 sm:space-y-6 text-center scroll-smooth min-h-0 bg-transparent" style="display: none;">
        <p class="text-slate-400 italic text-sm drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">Select or play a track to load LRC lyrics...</p>
      </div>
    </section>

    <!-- Playlist Drawer -->
    <aside id="playlist-drawer" class="absolute top-0 right-0 bottom-0 w-80 z-30 bg-slate-900/95 backdrop-blur-2xl border-l border-slate-800 shadow-2xl transition-transform duration-300 transform translate-x-full flex flex-col">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 text-slate-200 font-bold">
          <i class="fa-solid fa-list-ul text-emerald-400"></i><span>Playlist</span>
        </div>
        <button id="btn-close-playlist" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="px-4 py-2 border-b border-slate-800/80 bg-slate-950/80 flex items-center gap-2 shrink-0">
        <span class="text-[11px] text-slate-400 font-semibold shrink-0"><i class="fa-solid fa-layer-group text-emerald-400 mr-1"></i>分類:</span>
        <select id="playlist-group-select" class="w-full px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-800 text-slate-200 border border-slate-700">
          <option value="all">📁 全部歌曲 (All Songs)</option>
        </select>
      </div>
      <div class="px-4 py-2 border-b border-slate-800/80 bg-slate-950/60 flex items-center gap-2 shrink-0">
        <span class="text-[11px] text-slate-400 font-semibold shrink-0"><i class="fa-solid fa-arrow-down-a-z text-emerald-400 mr-1"></i>排序:</span>
        <button id="btn-sort-title" class="flex-1 px-2 py-1 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"><i class="fa-solid fa-music text-[10px] mr-1 text-emerald-400"></i>歌名順序</button>
        <button id="btn-sort-artist" class="flex-1 px-2 py-1 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"><i class="fa-solid fa-user text-[10px] mr-1 text-emerald-400"></i>歌手順序</button>
      </div>
      <div class="px-4 py-2 border-b border-slate-800/80 bg-slate-950/40 shrink-0">
        <div class="relative flex items-center">
          <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-500 text-xs pointer-events-none"></i>
          <input id="playlist-search-input" type="text" placeholder="Search title or artist..." class="w-full pl-8 pr-7 py-1.5 bg-slate-800/90 border border-slate-700/80 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          <button id="btn-clear-search" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-200 text-xs"><i class="fa-solid fa-circle-xmark"></i></button>
        </div>
      </div>

      <div id="playlist-items" class="flex-1 overflow-y-auto p-3 space-y-1"></div>
    </aside>
  </main>

  <!-- Footer Playback Controls -->
  <footer class="relative z-20 px-4 sm:px-6 py-3 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 shrink-0">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2.5 sm:gap-4">
      <div class="w-full flex items-center gap-3 order-1 md:order-2">
        <span id="time-current" class="text-xs font-mono text-slate-400 w-10 text-right">00:00</span>
        <input id="slider-progress" type="range" min="0" max="100" value="0" class="flex-1">
        <span id="time-total" class="text-xs font-mono text-slate-400 w-10">00:00</span>
        <div class="flex items-center gap-2 order-3 w-full md:w-auto justify-center">
          <button id="btn-mute" class="text-slate-400 hover:text-white"><i id="icon-mute" class="fa-solid fa-volume-high text-base"></i></button>
          <input id="slider-volume" type="range" min="0" max="1" step="0.01" value="0.8" class="w-20 sm:w-24">
        </div>
      </div>
      <div class="flex items-center gap-3 sm:gap-4 order-2 md:order-1">
        <button id="btn-shuffle" title="Shuffle Playback" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all"><i class="fa-solid fa-shuffle text-base"></i></button>
        <button id="btn-prev" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-backward-step text-lg"></i></button>
        <button id="btn-play-pause" class="p-3 sm:p-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold shadow-lg"><i id="icon-play-pause" class="fa-solid fa-play text-xl"></i></button>
        <button id="btn-next" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800"><i class="fa-solid fa-forward-step text-lg"></i></button>
        <button id="btn-loop-mode" class="p-2 rounded-xl text-emerald-400 hover:bg-slate-800 relative"><i class="fa-solid fa-repeat text-base"></i></button>
        <span id="lyric-btn" onclick="toggleLyric()" style="cursor: pointer; font-size: 20px;"></span>
      </div>
    </div>
  </footer>

  <audio id="audio-player" class="hidden" crossorigin="anonymous" preload="auto"></audio>
  <script src="55playlist.js"></script>
  <script>
    // --- UNIVERSAL PLAYLIST NORMALIZER ---
    let playlist = [];
    if (typeof playlists !== 'undefined') {
      if (Array.isArray(playlists)) {
        playlist = playlists.map(track => ({
          ...track,
          group: track.group || 'all',
          audioUrl: track.audioUrl || track.src || '',
          cover: track.cover || 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover',
          lrcRaw: track.lrcRaw || ''
        }));
      } else if (typeof playlists === 'object' && playlists !== null) {
        playlist = [];
        Object.keys(playlists).forEach(groupName => {
          if (Array.isArray(playlists[groupName])) {
            playlists[groupName].forEach(track => {
              playlist.push({
                ...track,
                group: track.group || groupName,
                audioUrl: track.audioUrl || track.src || '',
                cover: track.cover || 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover',
                lrcRaw: track.lrcRaw || ''
              });
            });
          }
        });
      }
    } else if (typeof window.playlist !== 'undefined' && Array.isArray(window.playlist)) {
      playlist = window.playlist.map(track => ({
        ...track,
        group: track.group || 'all',
        audioUrl: track.audioUrl || track.src || '',
        cover: track.cover || 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover',
        lrcRaw: track.lrcRaw || ''
      }));
    }

    let currentTrackIndex = 0;
    let parsedLyrics = [];
    let activeLyricIndex = -1;
    let isShuffle = false;
    let loopMode = 'all';
    let karaokeColorMode = 'gradient';
    let coverFitMode = 'contain';
    let enableVisualizer = true;
    let isLrcSynced = true;
    let vizAnimFrameId = null;
    let searchFilterQuery = '';
    let selectedGroupFilter = 'all';
    let currentBlurValue = 0;
    let currentCloudSpeed = 1.0;
    let currentCloudAmount = 6;

    let currentVizModeIndex = 0;
    let lastActiveVizModeIndex = 0;
    const vizModes = [
      { id: 'ladder', name: 'Ladder' },
      { id: 'wave', name: 'Wave' },
      { id: 'radial', name: 'Radial' },
      { id: 'starburst', name: 'Starburst' },
      { id: 'off', name: 'Off' }
    ];

    const particles = Array.from({ length: 45 }, () => ({ x: 0, y: 0, vx: 0, vy: 0, radius: 0, alpha: 0, hue: 0 }));

    let coverImageObj = new Image();
    coverImageObj.crossOrigin = "anonymous";
    let coverCanvasSource = document.createElement('canvas');
    let coverCtxSource = coverCanvasSource.getContext('2d');

    const audio = document.getElementById('audio-player');
    const artCover = document.getElementById('art-cover');
    const artCoverMobile = document.getElementById('art-cover-mobile');
    
    const btnCoverFit = document.getElementById('btn-cover-fit');
    const labelCoverFit = document.getElementById('label-cover-fit');
    const iconCoverFit = document.getElementById('icon-cover-fit');

    const sliderBlur = document.getElementById('slider-blur');
    const sliderOpacity = document.getElementById('slider-opacity');
    const blurVal = document.getElementById('blur-val');
    const opacityVal = document.getElementById('opacity-val');
    const smokeBadge = document.getElementById('smoke-badge');

    const sliderCloudSpeed = document.getElementById('slider-cloud-speed');
    const speedVal = document.getElementById('speed-val');
    const sliderCloudAmount = document.getElementById('slider-cloud-amount');
    const amountVal = document.getElementById('amount-val');

    const sliderBlurM = document.getElementById('slider-blur-m');
    const sliderOpacityM = document.getElementById('slider-opacity-m');
    const blurValM = document.getElementById('blur-val-m');
    const opacityValM = document.getElementById('opacity-val-m');
    const sliderCloudSpeedM = document.getElementById('slider-cloud-speed-m');
    const speedValM = document.getElementById('speed-val-m');
    const sliderCloudAmountM = document.getElementById('slider-cloud-amount-m');
    const amountValM = document.getElementById('amount-val-m');

    const mobileControlsBar = document.getElementById('mobile-controls-bar');
    const btnToggleMobileControls = document.getElementById('btn-toggle-mobile-controls');

    const lyricContainer = document.getElementById('lyric-container');
    const lyricTitle = document.getElementById('lyric-title');
    const lyricMeta = document.getElementById('lyric-meta');
    const headerSongInfo = document.getElementById('header-song-info');

    const lyricColorIcon = document.getElementById('lyric-color-icon');
    const btnLyricColor = document.getElementById('btn-lyric-color'); 
    const btnToggleSync = document.getElementById('btn-toggle-sync');
    const labelSyncMode = document.getElementById('label-sync-mode');

    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPlayPause = document.getElementById('icon-play-pause');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnLoopMode = document.getElementById('btn-loop-mode');
    const btnColorMode = document.getElementById('btn-color-mode');
    const labelColorMode = document.getElementById('label-color-mode');
    
    const btnVizToggle = document.getElementById('btn-viz-toggle');
    const labelVizMode = document.getElementById('label-viz-mode');

    const sliderProgress = document.getElementById('slider-progress');
    const sliderVolume = document.getElementById('slider-volume');
    const btnMute = document.getElementById('btn-mute');
    const iconMute = document.getElementById('icon-mute');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');

    const playlistDrawer = document.getElementById('playlist-drawer');
    const btnTogglePlaylist = document.getElementById('btn-toggle-playlist');
    const btnClosePlaylist = document.getElementById('btn-close-playlist');
    const playlistItems = document.getElementById('playlist-items');

    const btnSortTitle = document.getElementById('btn-sort-title');
    const btnSortArtist = document.getElementById('btn-sort-artist');
    const playlistSearchInput = document.getElementById('playlist-search-input');
    const btnClearSearch = document.getElementById('btn-clear-search');
    const playlistGroupSelect = document.getElementById('playlist-group-select');

    const canvas = document.getElementById('visualizer-canvas');
    const canvasCtx = canvas ? canvas.getContext('2d') : null;

    const miniCanvas = document.getElementById('mini-visualizer-canvas');
    const miniCanvasCtx = miniCanvas ? miniCanvas.getContext('2d') : null;

    const smokeCanvas = document.getElementById('smoke-canvas');
    const smokeCtx = smokeCanvas ? smokeCanvas.getContext('2d') : null;
    const smokeCanvasMobile = document.getElementById('smoke-canvas-mobile');
    const smokeCtxMobile = smokeCanvasMobile ? smokeCanvasMobile.getContext('2d') : null;

    // --- WEB AUDIO API & REAL FREQUENCY ANALYZER SETUP ---
    let audioCtx = null;
    let analyser = null;
    let audioSourceNode = null;
    let frequencyDataArray = null;
    let isAudioCtxInitialized = false;

    function initAudioContext() {
      if (isAudioCtxInitialized) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128; // 64 frequency bins
        frequencyDataArray = new Uint8Array(analyser.frequencyBinCount);

        audioSourceNode = audioCtx.createMediaElementSource(audio);
        audioSourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        isAudioCtxInitialized = true;

    function loadCoverImageForSampling(url) {
      coverImageObj.src = url;
      coverImageObj.onload = () => {
        coverCanvasSource.width = coverImageObj.naturalWidth || 100;
        coverCanvasSource.height = coverImageObj.naturalHeight || 100;
        coverCtxSource.drawImage(coverImageObj, 0, 0, coverCanvasSource.width, coverCanvasSource.height);

    function sampleVividCoverColor(nx, ny) {
      try {
        const px = Math.floor(nx * coverCanvasSource.width);
        const py = Math.floor(ny * coverCanvasSource.height);
        const pixel = coverCtxSource.getImageData(px, py, 1, 1).data;
        let r = Math.min(255, pixel[0] * 1.4);
        let g = Math.min(255, pixel[1] * 1.4);
        let b = Math.min(255, pixel[2] * 1.4);
        return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
      } catch (e) {
        return 'rgb(16, 185, 129)';
      }
    }

    function parseLRC(lrcString) {
      if (!lrcString) return { meta: {}, lines: [] };
      const lines = lrcString.split('\n');
      const lyricLines = [];
      const meta = {};
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      const metaRegex = /\[(ti|ar|al):(.*)\]/i;

      lines.forEach(line => {
        const lineTrim = line.trim();
        const metaMatch = lineTrim.match(metaRegex);
        if (metaMatch) { meta[metaMatch[1].toLowerCase()] = metaMatch[2].trim(); return; }
        const timeMatch = lineTrim.match(timeRegex);
        if (timeMatch) {
          const minutes = parseInt(timeMatch[1], 10);
          const seconds = parseInt(timeMatch[2], 10);
          const msStr = timeMatch[3];
          const milliseconds = msStr.length === 2 ? parseInt(msStr, 10) * 10 : parseInt(msStr, 10);
          const timeInSeconds = minutes * 60 + seconds + milliseconds / 1000;
          const text = lineTrim.replace(timeRegex, '').trim();
          lyricLines.push({ time: timeInSeconds, text: text || '♪' });
        }
      });
      lyricLines.sort((a, b) => a.time - b.time);
      return { meta, lines: lyricLines };
    }

      const fallbackUrl = 'https://placehold.co/400x400/1e293b/10b981?text=No+Cover';
      artCover.src = track.cover;

      if (artCoverMobile) {

      const parsed = parseLRC(track.lrcRaw);
      parsedLyrics = parsed.lines;

      const songTitle = parsed.meta.ti || track.title || "Unknown Title";
      const songArtist = parsed.meta.ar || track.artist || "Unknown Artist";
      const songAlbum = parsed.meta.al || track.album || "Unknown Album";

      if (lyricTitle) lyricTitle.textContent = songTitle;
      if (lyricMeta) lyricMeta.textContent = `${songArtist} • ${songAlbum}`;

      if (!parsedLyrics || parsedLyrics.length === 0 || !isLrcSynced) return;
      let index = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) index = i; else break;

      if (index !== activeLyricIndex) {
        if (activeLyricIndex !== -1) {
          const prevEl = document.getElementById(`lyric-line-${activeLyricIndex}`);
          if (prevEl) {

        activeLyricIndex = index;

          const activeEl = document.getElementById(`lyric-line-${activeLyricIndex}`);

            activeEl.style.removeProperty('--progress');

    function startVisualizerAnimation() {
      if (vizAnimFrameId) cancelAnimationFrame(vizAnimFrameId);

      const numBars = 32;
      const barFrequencies = Array.from({ length: numBars }, () => 0.1);

      function draw() {
        vizAnimFrameId = requestAnimationFrame(draw);

        const isPlaying = !audio.paused && !audio.ended && audio.currentTime > 0;
        const currentMode = vizModes[currentVizModeIndex].id;

        // Fetch real frequency data if available, otherwise blend with smooth fallback simulation
        if (isPlaying && analyser && frequencyDataArray) {
          analyser.getByteFrequencyData(frequencyDataArray);
          for (let i = 0; i < numBars; i++) {
            const freqIndex = Math.floor((i / numBars) * (frequencyDataArray.length / 2));
            const rawVal = frequencyDataArray[freqIndex] / 255;
            const target = Math.max(rawVal * (audio.volume || 0.8), 0.05);
            barFrequencies[i] += (target - barFrequencies[i]) * 0.35;
          }
        } else {
          for (let i = 0; i < numBars; i++) {
            if (isPlaying) {
              const target = (Math.sin((Date.now() / 110) + (i * 0.35)) * 0.4 + 0.5) * (audio.volume || 0.8);
              barFrequencies[i] += (target - barFrequencies[i]) * 0.25;
            } else {
              barFrequencies[i] *= 0.88;
            }
          }
        }

        if (currentBlurValue >= 10) {
          [ {ctx: smokeCtx, canvas: smokeCanvas}, {ctx: smokeCtxMobile, canvas: smokeCanvasMobile} ].forEach(item => {
            if (!item.ctx || !item.canvas) return;
            const w = item.canvas.width = item.canvas.clientWidth || 300;
            const h = item.canvas.height = item.canvas.clientHeight || 300;

            item.ctx.clearRect(0, 0, w, h);
            item.ctx.globalCompositeOperation = 'screen';

            const blurIntensity = Math.min((currentBlurValue - 5) / 35, 1.0);

            for (let idx = 0; idx < currentCloudAmount && idx < cloudBlobs.length; idx++) {
              const cloud = cloudBlobs[idx];
              cloud.phase += 0.015 * currentCloudSpeed; 
              const curX = cloud.x + Math.sin(cloud.phase + idx) * 45;
              const curY = cloud.y + Math.cos(cloud.phase * 0.8 + idx) * 40;

              const sampledColor = sampleVividCoverColor(cloud.sampleX, cloud.sampleY);
              const grad = item.ctx.createRadialGradient(curX, curY, 0, curX, curY, cloud.radius);
              
              grad.addColorStop(0, sampledColor.replace('rgb', 'rgba').replace(')', `, ${0.6 * blurIntensity})`));
              grad.addColorStop(0.6, sampledColor.replace('rgb', 'rgba').replace(')', `, ${0.25 * blurIntensity})`));
              grad.addColorStop(1, 'rgba(0,0,0,0)');

              item.ctx.fillStyle = grad;
              item.ctx.beginPath();
              item.ctx.arc(curX, curY, cloud.radius, 0, Math.PI * 2);
              item.ctx.fill();
            }
          });
        }

        if (enableVisualizer) {
          if (canvasCtx && canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();

            if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
              canvas.width = rect.width * dpr;
              canvas.height = rect.height * dpr;
            }

            canvasCtx.save();
            canvasCtx.scale(dpr, dpr);
            canvasCtx.clearRect(0, 0, rect.width, rect.height);

            const width = rect.width;
            const height = rect.height;

            if (currentMode === 'ladder') {
              const barGap = 3;
              const barWidth = Math.max((width - (numBars * barGap)) / numBars, 2);
              const totalSegments = 10;

              for (let i = 0; i < numBars; i++) {
                const x = i * (barWidth + barGap);
                const freqVal = barFrequencies[i];
                const activeSegments = Math.round(freqVal * totalSegments);

                for (let s = 0; s < totalSegments; s++) {
                  const segHeight = (height - (totalSegments * 1.5)) / totalSegments;
                  const y = height - (s + 1) * (segHeight + 1.5);

                  if (s < activeSegments) {
                    const hue = 140 + (s / totalSegments) * 120;
                    canvasCtx.fillStyle = `hsl(${hue}, 90%, 55%)`;
                    canvasCtx.shadowColor = `hsl(${hue}, 90%, 50%)`;
                    canvasCtx.shadowBlur = 4;
                  } else {
                    canvasCtx.fillStyle = 'rgba(30, 41, 59, 0.4)';
                    canvasCtx.shadowBlur = 0;
                  }

                  canvasCtx.beginPath();
                  canvasCtx.roundRect(x, y, barWidth, segHeight, [1]);
                  canvasCtx.fill();
                }
              }
            }
            else if (currentMode === 'wave') {
              canvasCtx.beginPath();
              canvasCtx.lineWidth = 3;
              canvasCtx.strokeStyle = '#10b981';
              canvasCtx.shadowColor = '#34d399';
              canvasCtx.shadowBlur = 12;

              const sliceWidth = width / numBars;
              let x = 0;

              for (let i = 0; i < numBars; i++) {
                const v = barFrequencies[i];
                const y = (height / 2) + Math.sin((i / 2) + (Date.now() / 150)) * (v * height * 0.6);

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += sliceWidth;
              }

              canvasCtx.lineTo(width, height / 2);
              canvasCtx.stroke();
            }
            else if (currentMode === 'radial') {
              const centerX = width / 2;
              const centerY = height / 2;
              const radius = Math.min(width, height) * 0.35;
              const angleStep = (Math.PI * 2) / numBars;

              for (let i = 0; i < numBars; i++) {
                const angle = i * angleStep;
                const barLen = barFrequencies[i] * (height * 0.5);

                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + barLen);
                const y2 = centerY + Math.sin(angle) * (radius + barLen);

                const hue = (i / numBars) * 360;
                canvasCtx.strokeStyle = `hsl(${hue}, 85%, 60%)`;
                canvasCtx.lineWidth = 3;
                canvasCtx.shadowColor = `hsl(${hue}, 85%, 50%)`;
                canvasCtx.shadowBlur = 8;

                canvasCtx.beginPath();
                canvasCtx.moveTo(x1, y1);
                canvasCtx.lineTo(x2, y2);
                canvasCtx.stroke();
              }
            }
            else if (currentMode === 'starburst') {
              const centerX = width / 2;
              const centerY = height / 2;
              const avgEnergy = barFrequencies.reduce((a, b) => a + b, 0) / numBars;

              particles.forEach((p, idx) => {
                if (p.alpha <= 0.05 && isPlaying) {
                  p.x = centerX;
                  p.y = centerY;
                  const angle = Math.random() * Math.PI * 2;
                  const speed = (Math.random() * 3 + 1) * (avgEnergy * 3 + 0.5);
                  p.vx = Math.cos(angle) * speed;
                  p.vy = Math.sin(angle) * speed;
                  p.radius = Math.random() * 3 + 1.5;
                  p.alpha = 1;
                  p.hue = Math.random() * 120 + 120;
                }

                p.x += p.vx;
                p.y += p.vy;
                p.alpha *= 0.95;

                if (p.alpha > 0.05) {
                  canvasCtx.fillStyle = `hsla(${p.hue}, 90%, 60%, ${p.alpha})`;
                  canvasCtx.shadowColor = `hsla(${p.hue}, 90%, 50%, ${p.alpha})`;
                  canvasCtx.shadowBlur = 6;
                  canvasCtx.beginPath();
                  canvasCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                  canvasCtx.fill();
                }
              });
            }

            canvasCtx.restore();
          }

          if (miniCanvasCtx && miniCanvas) {
            const miniDpr = window.devicePixelRatio || 1;
            const miniRect = miniCanvas.getBoundingClientRect();

            if (miniCanvas.width !== miniRect.width * miniDpr || miniCanvas.height !== miniRect.height * miniDpr) {
              miniCanvas.width = miniRect.width * miniDpr;
              miniCanvas.height = miniRect.height * miniDpr;
            }

            miniCanvasCtx.save();
            miniCanvasCtx.scale(miniDpr, miniDpr);
            miniCanvasCtx.clearRect(0, 0, miniRect.width, miniRect.height);

            const miniBars = 14;
            const miniWidth = miniRect.width;
            const miniHeight = miniRect.height;
            const miniGap = 1.5;
            const miniBarWidth = Math.max((miniWidth - (miniBars * miniGap)) / miniBars, 1.5);
            const miniSegments = 4;

            for (let i = 0; i < miniBars; i++) {
              const freqIdx = Math.floor((i / miniBars) * numBars);
              const freqVal = barFrequencies[freqIdx];
              const activeSegments = Math.round(freqVal * miniSegments);
              const x = i * (miniBarWidth + miniGap);

              for (let s = 0; s < miniSegments; s++) {
                const segHeight = (miniHeight - (miniSegments * 1)) / miniSegments;
                const y = miniHeight - (s + 1) * (segHeight + 1);

                if (s < activeSegments) {
                  const colors = ['#10b981', '#34d399', '#f59e0b', '#ef4444'];
                  miniCanvasCtx.fillStyle = colors[s % colors.length];
                } else {
                  miniCanvasCtx.fillStyle = 'rgba(30, 41, 59, 0.4)';
                }

                miniCanvasCtx.fillRect(x, y, miniBarWidth, segHeight);
              }
            }

            miniCanvasCtx.restore();
          }
        }
      }

      draw();
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    window.onload = () => {
      updateGroupDropdown();
      loadTrack(0);
      startVisualizerAnimation();
    };
  </script>
</body>
